<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>鉄道ホームページ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="state-initial"> <!-- 最初はメニューのみ表示する状態 -->

    <!-- 上部メニューエリア (旧 fr_top_01.html) -->
    <header id="top-area">
        <iframe src="fr_top_01.html" name="top"></iframe>
    </header>

    <div id="main-container">
        <!-- 左側リストエリア (旧 left_upper) -->
        <nav id="left-area">
            <iframe src="about:blank" name="left_upper"></iframe>
        </nav>

        <!-- 右側コンテンツエリア (旧 right) -->
        <main id="right-area">
            <iframe src="about:blank" name="right"></iframe>
        </main>
    </div>

    <script>
        // リンクがクリックされたときにレイアウトを変更する補助スクリプト
        window.addEventListener('message', function(e) {
            if (e.data === 'show-list') {
                document.body.className = 'state-split';
            }
        });
    </script>
</body>
</html>
