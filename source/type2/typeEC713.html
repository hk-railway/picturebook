<P><FONT size=4><STRONG><U>★７１３系　近郊型交流電車（2023.04.13）</U></STRONG></FONT></P>
<P><TABLE cellSpacing=0 cellPadding=0 border=0>
  <TR>
    <TD colSpan=5><FONT size=3><A name=EC713-0><A href="../type/EC713.html#EC713-0">【７１３系０番台】（2008年12月～）</A></A></FONT></TD>
  </TR>
  <TR>
    <TD width=20></TD>
    <TD><A href="https://raw.githubusercontent.com/hk-railway/picturebook/main/picture/train/JR-LOCAL-EC1/713nippo-5.jpg" target=_blank>
        <IMG height=108 alt=713nippo-5.jpg src="https://raw.githubusercontent.com/hk-railway/picturebook/main/picture/train/JR-LOCAL-EC1/713nippo-5.jpg" width=144></A></TD>
    <TD width=10></TD>
    <TD width=148><FONT size=2>2025.05<BR>日豊本線南宮崎駅<BR>クモハ713-2<BR>普通</FONT></TD>
    <TD>交流電化された地方幹線における、普通列車の電車化の促進のために開発され、1984年2月にデビューした。<BR>
しかし国鉄の財政悪化により、余剰化した急行形電車の車体載せ替えや近郊形化改造により必要両数を投入する方針に転換されたため、<BR>
試作車（900番台）として4編成8両が新製されたのみとなった。<BR>
2008年から2010年にかけて主制御機器の換装を伴う更新工事が鹿児島総合車両所で施工され、同時に0番台に改番された。<BR>
　<BR>
