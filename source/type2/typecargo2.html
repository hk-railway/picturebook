    <TD width=148><FONT size=2>2025.12<BR>三岐鉄道三岐線<BR>保々～北勢中央公園口間<BR>ホキ1100-2<BR>（貨物）</FONT></TD>
    <TD>太平洋セメント所有の私有貨車（車籍はJR貨物）で、フライアッシュ・炭酸カルシウム運搬用のホッパ車。<BR>
三岐鉄道東藤原駅から衣浦臨海鉄道碧南市駅の間で運用されており、太平洋セメント藤原工場（東藤原駅隣接）から炭酸カルシウムを輸送し、<BR>
碧南市駅（JERA碧南火力発電所）からフライアッシュ（石炭灰）を輸送する。<BR>
本形式で運転される列車は車体色に因んで「白ホキ貨物」の愛称がある。<BR>
