  <TR>
    <TD colSpan=5><FONT size=3><A name=kumoya145-100><A href="../type/EC145.html#kumoya145-100">【１４５形１００番台】（1982年～2020年）</A></A></FONT></TD>
  </TR>
  <TR>
    <TD width=20></TD>
    <TD><A href="https://raw.githubusercontent.com/hk-railway/picturebook/main/picture/train/JR-ETC/145-100training-3.jpg" target=_blank>
        <IMG height=108 alt=145-100training-3.jpg src="https://raw.githubusercontent.com/hk-railway/picturebook/main/picture/train/JR-ETC/145-100training-3.jpg" width=144></A></TD>

    <TD width=148><FONT size=2>2021.02<BR>八王子総合訓練所<BR>クモヤ145-118<BR>（留置）</FONT></TD>
    <TD><A href="../type/EC101.html">101系電車</A>を改造した単独電動車 (1M)方式の直流用新性能電車で、<BR>
ATCを用いない線区の旧性能牽引車の置き換え用として登場した。<BR>
救援車として使用できるように車体中央部に救援機材積載用のスペースを設け、天井にはクレーンが設置されている。<BR>
それに伴い側窓と側扉の配置が0番台から変更され、新たに機器搬入口が設けられた。<BR>
26両が改造製作され、2020年までに廃車または1000番台に改造、廃区分番台となった。<BR>
