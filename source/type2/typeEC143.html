    <TD width=148><FONT size=2>2022.03<BR>埼京線大崎駅<BR>クモヤ143-9<BR>（廃車回送）</FONT></TD>
    <TD>新設の車両基地には牽引車の配置がなかった首都圏用に、ATC対応の新性能牽引車として21両が製造された。<BR>
車体は1M方式の前面貫通・両運転台構造。<BR>
ATCで必要なブレーキ力を確保しつつ新性能電車1両を無動力で牽引でき、直流新性能電車全てと協調運転可能な設計となっている。<BR>
牽引車として本線を走行するほか、各車両基地での入換作業や、最寄駅との間で社員輸送などを行うことも多かった。<BR>
