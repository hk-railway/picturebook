    <TD>特急「はつかり」の<A href="../type2/typeEC485.html">485系</A>置き換え用として登場。<BR>
すでに「JR東日本管内で運用される485系の取替え」を意識した車両として、同様に交直流電車である<A href="../type2/typeEC653.html">E653系</A>が開発されていたが、<BR>
コストパフォーマンスを考慮した結果、将来の直流区間への乗り入れを想定せず、交流専用電車とすることとなり、E653系をベースとした別形式として開発されたもの。<BR>
6両編成3本が製造されたが、運転区間が奥羽線内のみになったのを契機に4両編成に短縮された。<BR>
