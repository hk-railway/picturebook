    <TD width=148><FONT size=2>2001.10<BR>鹿児島本線八代駅<BR>クモハ716-901<BR>普通</FONT></TD>
    <TD>日豊本線鹿児島地区の列車遅延改善のため、<A href="../type/EC457.html">457系</A>の電動車ユニット改造で登場した交流専用車両。2両編成。<BR>
クモハ717-901の種車はクモハ457-14、クモハ716-901は中間電動車（モハ456-14）に廃車となったクハ455-601の運転台を接合した。<BR>
車体中央部に両開きドアを新設し、片側3扉構造となった。<BR>
2009年10月に<A href="../type2/typeDC220.html">キハ220形</A>に置き換えられる形で定期運用を離脱、間もなく廃車回送された。<BR>
