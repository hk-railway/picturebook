<P><A name=EC207-900>【２０７系９００番台】</A>
<BR><FONT size=3>
　・製造初年：　昭和６１年<BR>
　・配置　　：　ＪＲ東日本 … 常磐線、東京メトロ／千代田線乗り入れ<BR>
<P>　常磐緩行線・東京メトロ千代田線乗り入れ用の車両。<BR>
　車体は２０５系に準じたステンレス製で、旧国鉄初のＶＶＶＦインバータ制御車。先頭車には地下鉄乗り入れのため非常口を備える。<BR>
　新製当時は、性能面では満足できたがコスト面で引き合わないということで量産化は見送られ、９００番台の試作車１編成１０両のみとなった。</P></FONT>
