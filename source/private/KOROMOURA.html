    <TD>1975年の開業時から使用されている、旧国鉄の<A href="../type/DL10.html">DE10形</A>と同タイプの機関車。<BR>

衣浦臨海鉄道の自社発注車両（1、3号機）と旧国鉄車両（2、5号機）とでは細部が異なる。<BR>
